<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HotShort Director Debug Viewer</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a24;
    --border: #252a38;
    --accent: #7c3aed;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
    --red: #ef4444;
    --yellow: #eab308;
    --text: #e2e8f0;
    --muted: #64748b;
    --font: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
  }
  header h1 { font-size: 17px; color: var(--accent); letter-spacing: 0.05em; }
  header span { color: var(--muted); font-size: 12px; }

  #drop-zone {
    margin: 40px auto; width: 480px; padding: 48px 32px;
    border: 2px dashed var(--border); border-radius: 12px;
    text-align: center; cursor: pointer; transition: border-color 0.2s;
  }
  #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); }
  #drop-zone p { color: var(--muted); margin-top: 10px; font-size: 12px; }
  #drop-zone button {
    margin-top: 20px; padding: 10px 24px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    font-family: var(--font);
  }
  #file-input { display: none; }

  #app { display: none; }

  #summary {
    display: flex; gap: 16px; padding: 14px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat value { font-size: 18px; font-weight: 700; }
  .stat.split value  { color: var(--purple); }
  .stat.solo_l value { color: var(--green); }
  .stat.solo_r value { color: var(--blue); }

  #main { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 130px); }

  #timeline-wrap { overflow-y: auto; padding: 16px 24px; }
  #timeline-wrap h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; }
  #timeline { display: flex; flex-direction: column; gap: 2px; }

  .row {
    display: grid; grid-template-columns: 60px 90px 80px 80px 80px 1fr;
    gap: 8px; align-items: center; padding: 4px 8px;
    border-radius: 4px; cursor: pointer; transition: background 0.1s;
  }
  .row:hover { background: var(--border); }
  .row.selected { background: #1e1b4b; outline: 1px solid var(--accent); }
  .row.header { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; cursor: default; }
  .row.header:hover { background: none; }

  .mode-pill {
    padding: 2px 8px; border-radius: 4px; font-size: 11px;
    font-weight: 600; text-align: center; width: fit-content;
  }
  .SPLIT .mode-pill    { background: #4c1d95; color: var(--purple); border: 1px solid var(--purple); }
  .SOLO_LEFT .mode-pill  { background: #14532d; color: var(--green); border: 1px solid var(--green); }
  .SOLO_RIGHT .mode-pill { background: #1e3a8a; color: var(--blue); border: 1px solid var(--blue); }
  .HOLD .mode-pill     { background: #292524; color: #78716c; border: 1px solid #57534e; }

  .ema-bar { height: 6px; border-radius: 3px; background: var(--border); position: relative; overflow: hidden; }
  .ema-fill { height: 100%; border-radius: 3px; }

  #detail { border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  #detail h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 14px; }
  .detail-section { margin-bottom: 18px; }
  .detail-section h3 { font-size: 11px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border: none; }
  .kv label { color: var(--muted); }
  .kv value { color: var(--text); font-weight: 600; }
  .face-box { background: var(--border); border-radius: 6px; padding: 8px; margin-top: 6px; font-size: 11px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; margin-bottom: 4px; }
  .badge.left  { background: #14532d; color: var(--green); }
  .badge.right { background: #1e3a8a; color: var(--blue); }
  .badge.raw   { background: #292524; color: var(--muted); }
  .badge.talk  { background: #4c1d95; color: var(--purple); }

  #controls { display: flex; gap: 10px; padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #controls input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-family: var(--font); font-size: 12px; width: 200px;
  }
  .filter-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer;
    font-family: var(--font); font-size: 11px; transition: all 0.15s;
  }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>HotShort Director Debug</h1>
  <span id="file-label">No file loaded</span>
  <button onclick="document.getElementById('file-input').click()"
    style="margin-left:auto;padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:12px;">
    Load decisions.json
  </button>
  <input type="file" id="file-input" accept=".json">
</header>

<div id="drop-zone">
  <div style="font-size:32px">📂</div>
  <div style="font-size:15px;margin-top:8px;color:var(--text)">Drop decisions.json here</div>
  <p>Generate with: <code>HS_DEBUG_FRAMES=./debug_out python local_worker.py</code></p>
  <button onclick="document.getElementById('file-input').click()">Browse File</button>
</div>

<div id="app">
  <div id="summary"></div>
  <div id="controls">
    <input id="search" type="text" placeholder="Jump to t= (seconds)..." oninput="onSearch()">
    <button class="filter-btn active" data-mode="ALL" onclick="setFilter(this)">All</button>
    <button class="filter-btn" data-mode="SPLIT" onclick="setFilter(this)">SPLIT</button>
    <button class="filter-btn" data-mode="SOLO_LEFT" onclick="setFilter(this)">SOLO_L</button>
    <button class="filter-btn" data-mode="SOLO_RIGHT" onclick="setFilter(this)">SOLO_R</button>
    <button class="filter-btn" data-mode="TALKING" onclick="setFilter(this)">Talking</button>
    <span style="color:var(--muted);font-size:11px;margin-left:auto" id="row-count"></span>
  </div>
  <div id="main">
    <div id="timeline-wrap">
      <h2>Frame Decisions</h2>
      <div id="timeline">
        <div class="row header">
          <span>t (s)</span><span>mode</span><span>L ema</span>
          <span>R ema</span><span>gap</span><span>raw faces</span>
        </div>
      </div>
    </div>
    <div id="detail">
      <h2>Frame Detail</h2>
      <div id="detail-content" style="color:var(--muted);font-size:12px">Click a row to inspect</div>
    </div>
  </div>
</div>

<script>
let data = [];
let filter = 'ALL';
const MAX_EMA = 120;

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
});

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});

function loadFile(f) {
  const r = new FileReader();
  r.onload = e => {
    try {
      data = JSON.parse(e.target.result);
      document.getElementById('file-label').textContent = f.name + ' — ' + data.length + ' frames';
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderSummary();
      renderTimeline();
    } catch(err) { alert('Invalid JSON: ' + err.message); }
  };
  r.readAsText(f);
}

function renderSummary() {
  const counts = { SPLIT:0, SOLO_LEFT:0, SOLO_RIGHT:0, HOLD:0, TALKING:0 };
  data.forEach(d => {
    counts[d.mode] = (counts[d.mode] || 0) + 1;
    if (d.left?.talking || d.right?.talking) counts.TALKING++;
  });
  const pct = v => ((v/data.length)*100).toFixed(1) + '%';
  document.getElementById('summary').innerHTML = `
    <div class="stat"><label>Total frames</label><value>${data.length}</value></div>
    <div class="stat split"><label>SPLIT</label><value>${counts.SPLIT} <small style="font-size:12px;color:var(--muted)">(${pct(counts.SPLIT)})</small></value></div>
    <div class="stat solo_l"><label>SOLO LEFT</label><value>${counts.SOLO_LEFT}</value></div>
    <div class="stat solo_r"><label>SOLO RIGHT</label><value>${counts.SOLO_RIGHT}</value></div>
    <div class="stat"><label>Talking</label><value style="color:var(--purple)">${counts.TALKING}</value></div>
    <div class="stat"><label>Duration</label><value style="color:var(--text)">${data.length > 0 ? data[data.length-1].t.toFixed(1)+'s' : '-'}</value></div>
  `;
}

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.mode;
  renderTimeline();
}

function onSearch() {
  const q = parseFloat(document.getElementById('search').value);
  if (isNaN(q)) return;
  let best = null, bestDiff = Infinity;
  document.querySelectorAll('.row[data-t]').forEach(r => {
    const d = Math.abs(parseFloat(r.dataset.t) - q);
    if (d < bestDiff) { bestDiff = d; best = r; }
  });
  if (best) { best.scrollIntoView({behavior:'smooth', block:'center'}); best.click(); }
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  while (tl.children.length > 1) tl.removeChild(tl.lastChild);

  const filtered = data.filter(d => {
    if (filter === 'ALL') return true;
    if (filter === 'TALKING') return d.left?.talking || d.right?.talking;
    return d.mode === filter;
  });
  document.getElementById('row-count').textContent = filtered.length + ' rows';

  filtered.forEach(d => {
    const row = document.createElement('div');
    row.className = 'row ' + d.mode;
    row.dataset.t = d.t;

    const lEma = d.left?.ema ?? 0;
    const rEma = d.right?.ema ?? 0;
    const lPct = Math.min(100, (lEma/MAX_EMA)*100).toFixed(1);
    const rPct = Math.min(100, (rEma/MAX_EMA)*100).toFixed(1);
    const gapClr = d.split_eligible ? 'var(--green)' : 'var(--red)';
    const rawCount = d.raw_faces?.length ?? 0;

    row.innerHTML = `
      <span style="color:var(--muted)">${d.t.toFixed(2)}</span>
      <span><span class="mode-pill">${d.mode}</span></span>
      <span>
        <div class="ema-bar"><div class="ema-fill" style="width:${lPct}%;background:var(--green)"></div></div>
        <span style="font-size:10px;color:${d.left?.talking?'var(--purple)':'var(--muted)'}">${lEma.toFixed(1)}${d.left?.talking?' 🎙':''}</span>
      </span>
      <span>
        <div class="ema-bar"><div class="ema-fill" style="width:${rPct}%;background:var(--blue)"></div></div>
        <span style="font-size:10px;color:${d.right?.talking?'var(--purple)':'var(--muted)'}">${rEma.toFixed(1)}${d.right?.talking?' 🎙':''}</span>
      </span>
      <span style="color:${gapClr}">${(d.gap??0).toFixed(2)} ${d.split_eligible?'✓':'✗'}</span>
      <span style="color:var(--muted)">${rawCount} face${rawCount!==1?'s':''}</span>
    `;
    row.addEventListener('click', () => {
      document.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      renderDetail(d);
    });
    tl.appendChild(row);
  });
}

function renderDetail(d) {
  const kv = (k, v, color='') => `<div class="kv"><label>${k}</label><value style="color:${color || 'var(--text)'}">${v}</value></div>`;
  const faceBlock = (slot, f) => {
    if (!f?.present) return `<div class="face-box"><span class="badge ${slot}">${slot.toUpperCase()}</span> <span style="color:var(--red)">not present</span></div>`;
    const hPct = f.h ? ((f.h/1080)*100).toFixed(1)+'%' : '?';
    const suspicious = f.h && f.h < 130;
    const roi = f.mouth_roi ? f.mouth_roi.join(', ') : 'none';
    return `<div class="face-box">
      <span class="badge ${slot}">${slot.toUpperCase()}</span>
      ${f.talking ? '<span class="badge talk">TALKING 🎙</span>' : ''}
      ${kv('pos', 'x='+f.x+' y='+f.y+' w='+f.w+' h='+f.h)}
      ${kv('h%', hPct, suspicious ? 'var(--red)' : 'var(--green)')}
      ${suspicious ? '<div style="color:var(--red);font-size:10px;margin:4px 0">⚠ False positive likely (&lt;130px in 1080p)</div>' : ''}
      ${kv('ema', f.ema?.toFixed(2), f.talking ? 'var(--purple)' : 'var(--muted)')}
      ${kv('mouth_roi', roi)}
    </div>`;
  };

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-section">
      <h3>Frame Info</h3>
      ${kv('t', d.t.toFixed(3)+'s')}
      ${kv('frame_idx', d.frame_idx)}
      ${kv('mode', '<span class="mode-pill">'+d.mode+'</span>')}
      ${kv('gap', (d.gap??0).toFixed(3))}
      ${kv('split_eligible', d.split_eligible ? '✓ Yes' : '✗ No', d.split_eligible ? 'var(--green)' : 'var(--red)')}
    </div>
    <div class="detail-section">
      <h3>Slots</h3>
      ${faceBlock('left', d.left)}
      ${faceBlock('right', d.right)}
    </div>
    <div class="detail-section">
      <h3>Raw Faces (${d.raw_faces?.length ?? 0})</h3>
      ${(d.raw_faces||[]).map((f,i) => {
        const hPct = ((f.h/1080)*100).toFixed(1);
        const sus = f.h < 130;
        return `<div class="face-box">
          <span class="badge raw">#${i}</span>
          ${kv('pos', 'x='+f.x+' y='+f.y)}
          ${kv('size', f.w+'x'+f.h+' ('+hPct+'% h)', sus ? 'var(--red)' : 'var(--green)')}
          ${sus ? '<div style="color:var(--red);font-size:10px;margin-top:4px">⚠ Too small - false positive</div>' : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}
</script>
</body>
</html>
